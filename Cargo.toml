[package]
name = "rapier_playground1"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
pollster = "0.3"
wgpu = "30.0"
glam = "0.33.3"
tobj = {version = "3.2", default-features = false, features = ["async"]}
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
rapier3d = "0.35.2"
rand = "0.9"
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
egui-wgpu = { version = "0.36", features = ["winit"] }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
wgpu = {version = "30.0", features = ["webgl"]}
reqwest = {version = "0.11"}
web-sys = {version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}
web-time = "1.1.0"

[dependencies.image]
version="0.24"
default-features = false
features=["jpeg", "png"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }